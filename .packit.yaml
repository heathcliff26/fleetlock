# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: tmp/copr.spec

packages:
  fleetlock:
    downstream_package_name: fleetlock
    upstream_package_name: fleetlock
    specfile_path: tmp/fleetlock.spec
    actions:
      post-upstream-clone:
        - mkdir -p tmp
        - cp tools/fleetlock.spec tmp/
        - sed -i -e '/^PLACEHOLDER_POSTINSTALL$/r tools/postinstall.sh' -e '/^PLACEHOLDER_POSTINSTALL$/d' tmp/fleetlock.spec
        - sed -i -e '/^PLACEHOLDER_PREREMOVE$/r tools/preremove.sh' -e '/^PLACEHOLDER_PREREMOVE$/d' tmp/fleetlock.spec
        - sed -i -e '/^PLACEHOLDER_POSTREMOVE$/r tools/postremove.sh' -e '/^PLACEHOLDER_POSTREMOVE$/d' tmp/fleetlock.spec
  fleetctl:
    downstream_package_name: fleetctl
    upstream_package_name: fleetctl
    specfile_path: tmp/fleetctl.spec
    actions:
      post-upstream-clone:
        - mkdir -p tmp
        - cp tools/fleetctl.spec tmp/

targets:
  - fedora-all-x86_64
  - fedora-all-aarch64
additional_repos:
  - copr://heathcliff26/golang

jobs:
  - job: copr_build
    trigger: pull_request
    branch: main

  - job: copr_build
    trigger: release
    owner: heathcliff26
    project: cli
